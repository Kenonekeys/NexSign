name: Deploy NexSign mdBook

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install mdBook
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/latest/download/mdbook.tar.gz | tar -xz
          sudo mv mdbook /usr/local/bin/mdbook

      - name: Build mdBook
        run: |
          mdbook build nexsign-docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: nexsign-docs/book

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
